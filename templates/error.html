{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="wrap notfound notfound-single">
  <div>
    <p class="code-big" aria-hidden="true">{{ code }}</p>
    <h1 class="h1-big">{{ title }}</h1>
    <p class="lead">{{ text }}</p>
    <p class="actions">
      <a class="btn" href="{{ url_for('index') }}">На главную</a>
      <a class="btn btn-ghost" href="{{ url_for('sitemap') }}">Карта сайта</a>
    </p>
  </div>
</div>
{% endblock %}
